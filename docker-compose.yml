# Dev environment — chỉ cần Postgres (kèm pgvector); backend/frontend chạy bằng npm run dev bên ngoài
services:
  postgres:
    image: pgvector/pgvector:pg16 # postgres 16 + extension vector (bắt buộc cho cột embedding)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vanban_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vanban}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vanban}"]
      interval: 5s
      retries: 10

volumes:
  pgdata_dev:
